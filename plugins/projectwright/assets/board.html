<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<!--
  projectwright board — LAYOUT ONLY. The data are read from the wiki by
  scripts/board.py, which writes board.html in the project root (generated,
  not versioned): the tasks, and what a board shows (assets/board-model.json,
  the same definition the pane of projectwright-board reads). This template is
  a file of the framework: a project can change it, and the change is a deviation.
-->
<style>
:root {
  --bg: #ffffff; --text: #37352f; --muted: #787774; --faint: #9b9a97; --line: #e9e9e7; --hover: #f7f7f5;
  --card: #ffffff; --accent: #2383e2; --shadow: 0 0 0 1px rgba(15,15,15,.07), 0 2px 4px rgba(15,15,15,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* the named colors of board-model.json: chip background, chip text, column background */
  --gray-bg: #e3e2e0; --gray-fg: #32302c; --gray-col: #f9f9f8;
  --blue-bg: #d3e5ef; --blue-fg: #183347; --blue-col: #f5f9fc;
  --red-bg: #ffe2dd; --red-fg: #5d1715; --red-col: #fdf6f5;
  --green-bg: #dbeddb; --green-fg: #1c3829; --green-col: #f6faf6;
  --yellow-bg: #fdecc8; --yellow-fg: #402c1b; --yellow-col: #fcfaf3;
  --orange-bg: #fadec9; --orange-fg: #49290e; --orange-col: #fdf7f2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #191919; --text: #d4d4d4; --muted: #9b9b9b; --faint: #7f7f7f; --line: #2f2f2f; --hover: #232323;
          --card: #252525; --accent: #529cca; --shadow: 0 0 0 1px rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.3);
          --gray-bg: #3a3a3a; --gray-fg: #e0e0e0; --gray-col: #1e1e1e;
          --blue-bg: #28456c; --blue-fg: #e6f0fa; --blue-col: #1b2129;
          --red-bg: #6e3630; --red-fg: #fbe4e1; --red-col: #241b1a;
          --green-bg: #2b593f; --green-fg: #e0f2e6; --green-col: #1a221d;
          --yellow-bg: #89632a; --yellow-fg: #fbf0dc; --yellow-col: #23201a;
          --orange-bg: #854c1d; --orange-fg: #fde8d6; --orange-col: #251d17;
          color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
       background: var(--bg); color: var(--text); }
main { max-width: 1400px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 64px) 48px; display: grid; gap: 14px; }
.head { display: grid; gap: 4px; }
.icon { width: 44px; height: 44px; border-radius: 8px; background: var(--hover); border: 1px solid var(--line);
        display: grid; place-items: center; font-weight: 700; color: var(--muted); }
h1 { font-size: 30px; line-height: 1.2; margin: 4px 0 0; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.progress { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; }
.views { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); }
.views button { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); cursor: pointer;
                padding: 6px 8px 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.views button.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
#search { margin-left: auto; margin-bottom: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--text); font: inherit; font-size: 13px; min-width: 180px; }
button:focus-visible, .card:focus-visible, tr.row:focus-visible, #search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; padding: 0 6px; font-size: 12px; line-height: 20px; white-space: nowrap; }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
.c-gray { background: var(--gray-bg); color: var(--gray-fg); } .c-blue { background: var(--blue-bg); color: var(--blue-fg); }
.c-red { background: var(--red-bg); color: var(--red-fg); } .c-green { background: var(--green-bg); color: var(--green-fg); }
.c-yellow { background: var(--yellow-bg); color: var(--yellow-fg); }
.c-orange { background: var(--orange-bg); color: var(--orange-fg); }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding: 4px 2px 8px; }
.col { border-radius: 8px; padding: 8px; display: grid; gap: 8px; align-content: start; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px; }
.n { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 0; border-radius: 6px; box-shadow: var(--shadow); padding: 9px 10px 10px; display: grid; gap: 6px;
        cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.card:hover { background: var(--hover); }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.card.cancelled .t { text-decoration: line-through; color: var(--muted); }
.props { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.id { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.who { font-size: 12px; color: var(--muted); }
.more { font: inherit; font-size: 13px; color: var(--faint); background: none; border: 0; text-align: left; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.more:hover { background: var(--hover); }
.empty { color: var(--faint); font-size: 13px; padding: 4px 6px; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 760px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th + th, td + td { border-left: 1px solid var(--line); }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--hover); }
td.title { font-weight: 600; }
td.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
td.date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.group td { border-left: 0; padding-top: 16px; }
.note { color: var(--muted); font-size: 13px; }
#peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line);
        box-shadow: -8px 0 24px rgba(15,15,15,.1); transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
        padding: 18px 28px 40px; z-index: 10; display: grid; gap: 14px; align-content: start; }
#peek.open { transform: none; }
@media (prefers-reduced-motion: reduce) { #peek { transition: none; } }
.peek-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.peek-top button { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); padding: 2px 9px; cursor: pointer; }
#peek h2 { font-size: 24px; line-height: 1.25; margin: 0; }
dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; }
.body { border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; }
.body h3 { font-size: 15px; margin: 14px 0 6px; }
.body p { margin: 0 0 8px; }
.body code { background: var(--hover); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
.body pre { background: var(--hover); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.links { display: grid; gap: 4px; font-size: 14px; }
.links b { font-size: 13px; }
a.wl { color: var(--accent); cursor: pointer; text-decoration: none; }
a.wl:hover { text-decoration: underline; }
.plain { color: var(--muted); }
.reminders { display: grid; gap: 2px; }
.reminders[hidden] { display: none; }
.reminders .rhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.reminders .late { color: var(--red-fg); font-size: 13px; }
.reminder { display: flex; align-items: baseline; gap: 10px; padding: 3px 6px; border-radius: 4px; font-size: 14px; }
.reminder .box { width: 14px; height: 14px; flex: none; border: 1.5px solid var(--faint); border-radius: 3px; transform: translateY(2px); }
.reminder.done { color: var(--faint); text-decoration: line-through; }
.reminder.done .box { background: var(--accent); border-color: var(--accent); }
.reminder .due { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.reminder .due.late { color: var(--red-fg); }
@media (prefers-color-scheme: dark) { .reminders .late, .reminder .due.late { color: #ff8a80; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="icon" id="icon" aria-hidden="true"></div>
    <h1 id="title">Tasks</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="reminders" id="reminders" hidden></div>
  <div class="views">
    <button data-view="board">Board</button>
    <button data-view="table">Table</button>
    <input id="search" type="search" placeholder="Search…" aria-label="Search the tasks">
  </div>
  <div id="view"></div>
  <p class="note">The board shows the tasks of the wiki and changes nothing. To create, move, assign or close a task, ask Claude
    (<code>/projectwright:manage-tasks</code>) or edit the task file: the board is regenerated automatically.</p>
</main>
<aside id="peek" aria-label="Task"></aside>

<script id="board-data" type="application/json">/*__BOARD_DATA__*/</script>
<script>
"use strict";
var DATA = JSON.parse(document.getElementById("board-data").textContent);
var MODEL = DATA.model;
var TASKS = DATA.tasks || [];
var BY_NAME = {};
TASKS.forEach(function (t) { BY_NAME[t.name] = t; });
var COLUMN = {}, PRIORITY = {};
MODEL.columns.forEach(function (c) { COLUMN[c.progress] = c; });
MODEL.priorities.forEach(function (p) { PRIORITY[p.value] = p; });
var state = { view: "board", q: "", expanded: {} };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function list(v) { return Array.isArray(v) ? v : (v == null || v === "" ? [] : [v]); }
function linkName(v) { var m = /\[\[([^\]|#]+)/.exec(String(v)); return m ? m[1].trim() : String(v); }
// TASK-0012, and T-WEB-0012 in a project not yet renumbered (framework.py renumber-tasks)
function idOf(name) { var m = /^(TASK-\d+|T-[A-Z0-9]+-\d+)/.exec(name); return m ? m[1] : name; }
// A link to another task opens it; any other note of the wiki is a name, the board shows only tasks.
function wl(name, label) {
  name = linkName(name);
  if (!BY_NAME[name]) return '<span class="plain">' + esc(label || name) + "</span>";
  return '<a class="wl" data-ref="' + esc(name) + '">' + esc(label || idOf(name) + " " + (BY_NAME[name].title || "")) + "</a>";
}
function chip(text, color, dot) { return '<span class="chip c-' + esc(color || "gray") + (dot ? " dot" : "") + '">' + esc(text) + "</span>"; }
function statusChip(progress) { var c = COLUMN[progress]; return c ? chip(c.label, c.color, true) : esc(progress); }
function priorityChip(value) { var p = PRIORITY[value]; return p ? chip(p.label, p.color) : esc(value); }
function blockers(t) { return list(t.blocked_by).map(linkName); }
// A blocker that is closed (a column of the history: done, cancelled) blocks no more.
function isClosed(name) { return BY_NAME[name] && MODEL.history.columns.indexOf(BY_NAME[name].progress) >= 0; }
function openBlockers(t) { return blockers(t).filter(function (n) { return !isClosed(n); }); }
function matches(t) {
  if (!state.q) return true;
  return [t.id, t.title, t.name, t.body, t.assignee, t.phase].join(" ").toLowerCase().indexOf(state.q.toLowerCase()) >= 0;
}

// One field of a task as the model names it, drawn the same way in the card, the table and the detail.
function value(t, field) {
  switch (field) {
    case "progress": return statusChip(t.progress);
    case "priority": return t.priority ? priorityChip(t.priority) : "";
    case "assignee": return t.assignee ? '<span class="who">@' + esc(t.assignee) + "</span>" : "";
    case "id": return '<span class="id">' + esc(t.id || idOf(t.name)) + "</span>";
    case "blocked_by": return openBlockers(t).length ? chip("Blocked by " + openBlockers(t).map(idOf).join(", "), (COLUMN.blocked || {}).color) : "";
    default: return esc(t[field]);
  }
}

function md(text) {
  // Minimal, safe Markdown: escape everything, then a few inline and block rules.
  var lines = esc(text || "").split("\n"), out = [], inList = false, inCode = false;
  lines.forEach(function (line) {
    if (/^```/.test(line)) { out.push(inCode ? "</pre>" : "<pre>"); inCode = !inCode; return; }
    if (inCode) { out.push(line); return; }
    var h = /^(#{1,3}) (.*)$/.exec(line);
    var li = /^\s*[-*] (.*)$/.exec(line);
    if (inList && !li) { out.push("</ul>"); inList = false; }
    if (h) { if (h[1] !== "#") out.push("<h3>" + inline(h[2]) + "</h3>"); }  // the note's own heading repeats the title
    else if (li) { if (!inList) { out.push("<ul>"); inList = true; } out.push("<li>" + inline(li[1]) + "</li>"); }
    else if (line.trim() !== "") { out.push("<p>" + inline(line) + "</p>"); }
  });
  if (inList) out.push("</ul>");
  if (inCode) out.push("</pre>");
  return out.join("\n");
}
function unesc(s) { var t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
function inline(s) {
  // s is already escaped: decode the wikilink parts before wl() escapes them again
  return s
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\\?\|([^\]]*))?\]\]/g, function (_m, n, label) {
      return wl(unesc(n), label ? unesc(label) : null);
    })
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

// The tasks of a column in the order of the model: by ID, the history newest first and only the latest few.
function column(progress, all) {
  var items = all.filter(function (t) { return t.progress === progress; });
  var history = MODEL.history.columns.indexOf(progress) >= 0;
  if (history && MODEL.history.newest_first) items.reverse();
  var shown = history && !state.expanded[progress] ? items.slice(0, MODEL.history.shown) : items;
  return { items: items, shown: shown };
}
function visibleColumns(all) {
  return MODEL.columns.filter(function (c) {
    return MODEL.hide_when_empty.indexOf(c.progress) < 0 || all.some(function (t) { return t.progress === c.progress; });
  });
}

function card(t) {
  var props = MODEL.card.filter(function (f) { return f !== "title"; }).map(function (f) { return value(t, f); }).join("");
  return '<button class="card ' + esc(t.progress) + '" data-ref="' + esc(t.name) + '"><span class="t">' + esc(t.title || t.name) +
         '</span><span class="props">' + props + "</span></button>";
}

function viewBoard(all) {
  return '<div class="kanban">' + visibleColumns(all).map(function (c) {
    var col = column(c.progress, all);
    var rest = col.items.length - col.shown.length;
    return '<div class="col" style="background:var(--' + esc(c.color) + '-col)"><div class="col-head">' + chip(c.label, c.color, true) +
           '<span class="n">' + col.items.length + "</span></div>" +
           (col.items.length ? col.shown.map(card).join("") : '<div class="empty">No tasks</div>') +
           (rest > 0 ? '<button class="more" data-more="' + esc(c.progress) + '">+ ' + rest + " more</button>" : "") + "</div>";
  }).join("") + "</div>";
}

function viewTable(all) {
  var head = MODEL.table.map(function (f) { return "<th>" + esc(MODEL.fields[f] || f) + "</th>"; }).join("");
  var rows = visibleColumns(all).map(function (c) {
    var items = column(c.progress, all).items;
    if (!items.length) return "";
    return '<tr class="group"><td colspan="' + MODEL.table.length + '">' + chip(c.label, c.color, true) + ' <span class="n">' + items.length + "</span></td></tr>" +
      items.map(function (t) {
        return '<tr class="row" tabindex="0" data-ref="' + esc(t.name) + '">' + MODEL.table.map(function (f) {
          var cls = f === "title" ? "title" : f === "id" ? "mono" : /^(created|updated|closed_on)$/.test(f) ? "date" : "";
          return '<td class="' + cls + '">' + (f === "title" ? esc(t.title || t.name) : f === "id" ? esc(t.id || idOf(t.name)) : value(t, f)) + "</td>";
        }).join("") + "</tr>";
      }).join("");
  }).join("");
  return '<div class="table"><table><thead><tr>' + head + "</tr></thead><tbody>" + rows + "</tbody></table></div>";
}

function openTask(name) {
  var t = BY_NAME[name];
  if (!t) return;
  var rows = MODEL.detail.map(function (f) {
    var v = f === "blocked_by" ? blockers(t).map(function (n) {
      return wl(n) + (isClosed(n) ? ' <span class="plain">(' + esc((COLUMN[BY_NAME[n].progress] || {}).label || BY_NAME[n].progress) + ", no longer blocks)</span>" : "");
    }).join(", ") : value(t, f);
    return v ? "<dt>" + esc(MODEL.fields[f] || f) + "</dt><dd>" + v + "</dd>" : "";
  }).join("");
  var linked = list(t.links).filter(function (n) { return BY_NAME[n]; });
  var others = list(t.links).filter(function (n) { return !BY_NAME[n]; });
  var html = '<div class="peek-top"><span class="id">' + esc(t.id || idOf(t.name)) + '</span><button id="close">Close</button></div>' +
             "<h2>" + esc(t.title || t.name) + "</h2><dl>" + rows + "</dl>" + '<div class="body">' + md(t.body) + "</div>";
  if (linked.length) html += '<div class="links"><b>Linked tasks</b>' + linked.map(function (n) { return "<div>→ " + wl(n) + "</div>"; }).join("") + "</div>";
  if (others.length) html += '<div class="note">See also: ' + others.map(esc).join(" · ") + "</div>";
  html += '<div class="note">' + esc(t.path) + "</div>";
  var p = document.getElementById("peek");
  p.innerHTML = html;
  p.classList.add("open");
  document.getElementById("close").onclick = closeTask;
}
function closeTask() { document.getElementById("peek").classList.remove("open"); }

function render() {
  var view = document.getElementById("view");
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.classList.toggle("active", b.getAttribute("data-view") === state.view);
  });
  if (DATA.project.tasks_mode !== "wiki") {
    view.innerHTML = '<p class="note">This project keeps its tasks in an external tracker (<code>tasks.mode: tracker</code>): the board is there.</p>';
    return;
  }
  var all = TASKS.filter(matches);
  view.innerHTML = !TASKS.length ? '<p class="note">No tasks in the wiki yet.</p>' : state.view === "table" ? viewTable(all) : viewBoard(all);
  try { localStorage.setItem("pw-board-view", state.view); } catch (e) { /* storage not available */ }
}

// The reminders of the user (reminders.py, outside the wiki): a checklist to read, as the pane shows it.
function today() {
  var d = new Date();
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}
function reminders() {
  var list = DATA.reminders || [], el = document.getElementById("reminders");
  if (!list.length) { el.hidden = true; return; }
  var open = list.filter(function (r) { return !r.done_on; });
  var late = open.filter(function (r) { return r.due && r.due < today(); });
  el.innerHTML = '<div class="rhead">' + chip("Reminders " + open.length, "yellow") +
    (late.length ? '<span class="late">' + late.length + " overdue</span>" : "") + "</div>" +
    list.map(function (r) {
      var isLate = !r.done_on && r.due && r.due < today();
      var due = r.due ? (r.due === today() ? "today" : r.due.slice(8, 10) + "/" + r.due.slice(5, 7)) : "";
      return '<div class="reminder' + (r.done_on ? " done" : "") + '"><span class="box" aria-hidden="true"></span><span>' + esc(r.text) +
             "</span>" + (due ? '<span class="due' + (isLate ? " late" : "") + '">' + esc(due) + "</span>" : "") + "</div>";
    }).join("");
  el.hidden = false;
}

function progressBar() {
  document.getElementById("progress").innerHTML = MODEL.columns.map(function (c) {
    var n = TASKS.filter(function (t) { return t.progress === c.progress; }).length;
    return n ? '<span style="flex:' + n + ";background:var(--" + esc(c.color) + '-bg)" title="' + esc(c.label) + ": " + n + '"></span>' : "";
  }).join("");
}

document.addEventListener("click", function (e) {
  var v = e.target.closest("[data-view]");
  if (v) { state.view = v.getAttribute("data-view"); render(); return; }
  var more = e.target.closest("[data-more]");
  if (more) { state.expanded[more.getAttribute("data-more")] = true; render(); return; }
  var ref = e.target.closest("[data-ref]");
  if (ref) openTask(ref.getAttribute("data-ref"));
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeTask(); return; }
  var row = e.target.closest && e.target.closest("tr.row");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openTask(row.getAttribute("data-ref")); }
});
document.getElementById("search").addEventListener("input", function (e) { state.q = e.target.value; render(); });

var done = TASKS.filter(function (t) { return t.progress === "done"; }).length;
